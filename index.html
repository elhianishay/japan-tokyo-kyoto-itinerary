<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>המסלול שלי ביפן</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b23a2e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="טיול יפן">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#fbf7ee; --card:#ffffff; --card2:#f3ead4; --text:#2c2620; --muted:#7a6f5e;
    --accent:#b23a2e; --accent2:#2c537a; --done:#33502a; --border:#ecdfc2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{overscroll-behavior-y:none;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(80px + env(safe-area-inset-bottom));overscroll-behavior-y:none;}
  header{padding:calc(12px + env(safe-area-inset-top)) 16px 14px;background:var(--card2);position:sticky;top:0;z-index:10;border-bottom:1px solid var(--border);border-radius:0 0 18px 18px;}
  header h1{margin:0 0 8px;font-size:19px;color:#3a2e1c;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  select,input,button,textarea{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;}
  button{cursor:pointer;}
  .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  .btn-secondary{background:var(--accent2);border-color:var(--accent2);color:#fff;}
  main{padding:12px;max-width:760px;margin:0 auto;}
  .day-group{margin-bottom:18px;}
  .day-title{font-size:16px;font-weight:700;color:var(--accent);margin:14px 0 6px;padding-right:4px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(60,46,20,0.06);}
  .card.done{opacity:0.6;}
  .card-photo{width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin-bottom:10px;display:block;background:var(--card2);cursor:zoom-in;}
  .card-thumb{width:44px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0;background:var(--card2);}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:99999;display:none;align-items:center;justify-content:center;overflow:hidden;touch-action:none;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:100%;transform-origin:0 0;will-change:transform;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;}
  .lightbox-bar{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;display:flex;gap:8px;z-index:2;}
  .lightbox-btn{width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.92);color:#111;font-size:22px;font-weight:700;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;}
  .allergy-launch{background:#b71c1c;color:#fff;border:none;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 3px 10px rgba(183,28,28,.3);}
  .allergy-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99998;display:none;overflow:auto;-webkit-overflow-scrolling:touch;}
  .allergy-modal.open{display:block;}
  .allergy-topbar{position:sticky;top:0;z-index:2;display:flex;gap:8px;justify-content:space-between;align-items:center;background:#b71c1c;color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;}
  .allergy-topbar button{border:none;border-radius:10px;padding:10px 14px;font-size:15px;font-weight:700;cursor:pointer;}
  .allergy-topbar .reset{background:rgba(255,255,255,.2);color:#fff;}
  .allergy-topbar .close{background:#fff;color:#b71c1c;}
  .allergy-card{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#faf8f5;color:#333;padding:20px;max-width:640px;margin:0 auto;}
  .allergy-card .header{text-align:center;border-bottom:3px solid #b71c1c;padding-bottom:15px;margin-bottom:20px;}
  .allergy-card .title-jp{font-size:2rem;color:#b71c1c;margin:0;}
  .allergy-card .title-he{font-size:1.2rem;margin:5px 0 0 0;color:#555;}
  .allergy-card .message-jp{font-size:1.1rem;text-align:center;margin-bottom:20px;font-weight:bold;color:#444;}
  .allergy-card .message-he{font-size:.95rem;color:#666;font-weight:normal;}
  .allergy-card .allergy-table{width:100%;border-collapse:collapse;margin-bottom:25px;background:#fff;}
  .allergy-card th,.allergy-card td{border:1px solid #e0e0e0;padding:12px 10px;text-align:right;font-size:16px;}
  .allergy-card th{background:#f4f4f4;font-weight:bold;}
  .allergy-card .jp-text{font-weight:bold;text-align:left;color:#b71c1c;font-size:17px;}
  .allergy-card .checkbox{width:44px;text-align:center;font-size:1.6rem;color:#ccc;}
  .allergy-card .section-title{background:#efefef;font-weight:bold;font-size:1.1rem;padding:8px 12px;margin-top:15px;border-right:4px solid #b71c1c;color:#333;}
  .allergy-card .allergy-row{cursor:pointer;}
  .allergy-card .allergy-row.checked{background:#fff0f0;}
  .allergy-card .allergy-row.checked td{font-weight:bold;}
  .allergy-card .allergy-row.checked .checkbox{color:#b71c1c;}
  .link-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px;}
  .link-row input{flex:1;min-width:110px;}
  .link-row .link-remove{cursor:pointer;font-size:13px;padding:6px 10px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--danger,#c0392b);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card-time{color:var(--accent2);font-weight:700;font-size:13px;white-space:nowrap;}
  .card-name-row{display:flex;align-items:center;gap:10px;margin:2px 0 4px;}
  .card-name{font-size:16px;font-weight:700;margin:0;}
  .card-notes{color:var(--muted);font-size:13px;margin:4px 0;}
  .wiki-summary{font-size:12px;color:var(--accent2);font-style:italic;margin:4px 0 2px;line-height:1.5;}
  .resto-btn{background:#fff3e0;border:1px solid #e8c88a;color:#7a4f00;font-size:12px;padding:4px 10px;border-radius:20px;margin:6px 0 2px;cursor:pointer;}
  .resto-panel{display:none;background:#fff8ef;border:1px solid #e8c88a;border-radius:10px;padding:10px 12px;margin:6px 0 4px;font-size:12px;line-height:1.7;}
  .resto-panel.open{display:block;}
  .resto-panel strong{color:#7a4f00;display:block;margin-top:6px;}
  .resto-panel strong:first-child{margin-top:0;}
  .resto-tip{color:#5a4500;background:#ffecc7;border-radius:6px;padding:4px 8px;margin-top:6px;font-style:italic;}
  .stars-row{display:flex;gap:2px;margin:6px 0 2px;align-items:center;}
  .star{font-size:22px;cursor:pointer;color:#d0c8b8;line-height:1;transition:color 0.1s;}
  .star.filled,.star.hover{color:#e8a020;}
  .star-label{font-size:11px;color:var(--muted);margin-right:6px;}
  .my-notes-wrap{margin:4px 0;}
  .my-notes-btn{background:none;border:none;color:var(--accent2);font-size:12px;padding:3px 0;text-decoration:underline;cursor:pointer;}
  .my-notes-area{display:none;margin-top:6px;}
  .my-notes-area.open{display:block;}
  .my-notes-area textarea{width:100%;resize:vertical;font-size:13px;border-radius:8px;padding:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-family:inherit;}
  .my-notes-save{margin-top:5px;font-size:12px;padding:5px 14px;}
  .card-desc{color:var(--text);font-size:13px;margin:8px 0;line-height:1.5;background:var(--card2);border-radius:8px;padding:10px;display:none;}
  .card-desc.open{display:block;}
  .toggle-desc{background:none;border:none;color:var(--accent2);font-size:12px;padding:4px 0;text-decoration:underline;}
  .card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .pill{font-size:12px;padding:3px 8px;border-radius:20px;background:var(--card2);color:var(--muted);}
  .actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .actions a, .actions button{text-decoration:none;font-size:13px;padding:6px 10px;border-radius:8px;}
  .link-map{background:#e6eef7;color:#2c537a;border:1px solid #c7dbef;}
  .link-call{background:#e3f0dc;color:#33502a;border:1px solid #c5e0b8;}
  .link-edit{background:var(--card2);color:var(--text);border:1px solid var(--border);}
  .link-del{background:#fbe6e2;color:#8a2f24;border:1px solid #f0c4ba;}
  .check{position:absolute;left:12px;top:12px;width:20px;height:20px;z-index:2;}
  .fab{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;border:none;border-radius:30px;padding:14px 26px;font-size:15px;font-weight:700;box-shadow:0 4px 14px rgba(178,58,46,0.35);}
  .modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;align-items:center;justify-content:center;}
  .modal-backdrop.open{display:flex;}
  .modal{background:var(--card);border-radius:12px;padding:20px;width:92%;max-width:440px;max-height:88vh;overflow-y:auto;}
  .modal h2{margin-top:0;font-size:18px;}
  .field{margin-bottom:10px;display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:12px;color:var(--muted);}
  .field input, .field textarea, .field select{width:100%;}
  .modal-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}
  .empty-msg{color:var(--muted);text-align:center;margin-top:40px;font-size:14px;}
  .stats{font-size:12px;color:var(--muted);margin-top:4px;}
  .sync-badge{font-size:11px;padding:2px 8px;border-radius:10px;margin-right:6px;}
  .sync-ok{background:#e3f0dc;color:#33502a;}
  .sync-bad{background:#fbe6e2;color:#8a2f24;}
  .img-preview{max-width:100%;max-height:120px;border-radius:8px;margin-top:4px;display:none;}
  .guide-modal .modal{max-width:600px;}
  .guide-section{background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;}
  .guide-section h3{margin:0 0 6px;font-size:15px;color:var(--accent);}
  .guide-section p{margin:0;font-size:13px;line-height:1.6;white-space:pre-wrap;color:var(--text);}
  .guide-section .actions{margin-top:8px;}
  .guide-cat-filter{width:100%;margin-bottom:12px;}
  .guide-cat-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px;padding:8px 12px;background:var(--accent);color:#fff;border-radius:8px;font-size:14px;font-weight:700;}
  .guide-cat-title:first-child{margin-top:0;}
  .guide-cat-title .count{font-size:11px;font-weight:600;opacity:0.85;}
  .btn-link{background:var(--card2);color:var(--accent2);border:1px solid var(--border);font-size:13px;}
  #mapScreen{display:none;position:fixed;inset:0;z-index:40;flex-direction:column;background:var(--bg);}
  #mapScreen.open{display:flex;}
  #mapEl{flex:1;width:100%;}
  .map-header{padding:10px 14px;background:var(--card2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0;}
  .map-header select{flex:1;}
  .map-status{font-size:12px;color:var(--muted);padding:4px 14px;background:var(--bg);flex-shrink:0;}
  .my-location-dot{width:18px;height:18px;border-radius:50%;background:#2c7ab2;border:3px solid #fff;box-shadow:0 0 0 0 rgba(44,122,178,0.5);animation:locPulse 1.8s infinite;}
  @keyframes locPulse{0%{box-shadow:0 0 0 0 rgba(44,122,178,0.45);}70%{box-shadow:0 0 0 16px rgba(44,122,178,0);}100%{box-shadow:0 0 0 0 rgba(44,122,178,0);}}
</style>
</head>
<body>

<header>
  <h1>🗾 המסלול שלי ביפן — 13.11 עד 25.11.2026</h1>
  <div class="toolbar">
    <select id="dayFilter"><option value="all">כל הימים</option></select>
    <input id="searchBox" placeholder="חיפוש מקום..." style="flex:1;min-width:120px;">
    <button id="mapBtn" class="link-map">🗺 מפה</button>
    <button id="guideBtn" class="link-edit">📖 מדריך לוגיסטי</button>
    <button id="allergyOpenBtn" class="link-edit" style="background:#b71c1c;color:#fff;">🍽️ כרטיס העדפות מזון</button>
    <button id="exportBtn" class="link-call">💾 גיבוי</button>
    <label id="importLabel" for="importFile" class="link-call" style="cursor:pointer;font-size:13px;padding:6px 10px;border-radius:8px;">📂 שחזור</label>
    <input type="file" id="importFile" accept=".json" style="display:none">
    <button id="dedupBtn" class="link-edit">🧹 כפילויות</button>
    <button id="resetBtn" class="link-del">איפוס</button>
  </div>
  <div class="stats" id="stats"><span id="syncBadge" class="sync-badge">מתחבר...</span></div>
</header>

<main id="main"></main>

<div id="mapScreen">
  <div class="map-header">
    <button id="mapCloseBtn" class="btn-primary" style="flex-shrink:0;font-size:16px;padding:10px 16px;">← חזרה</button>
    <select id="mapDayFilter"><option value="all">כל הימים</option></select>
    <button id="locateBtn" class="btn-secondary" style="flex-shrink:0;font-size:15px;padding:10px 14px;">📍 מיקום</button>
  </div>
  <div class="map-status" id="mapStatus"></div>
  <div id="mapEl"></div>
</div>

<div id="splash" style="position:fixed;inset:0;background:#fbf7ee;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity 0.6s;">
  <div style="font-size:72px;line-height:1;">🗾</div>
  <div style="font-size:24px;font-weight:600;color:#3a2e1c;">המסלול שלי ביפן</div>
  <div style="font-size:14px;color:#7a6f5e;">13.11 – 25.11.2026</div>
  <div style="margin-top:8px;width:36px;height:4px;border-radius:4px;background:#b23a2e;animation:splashBar 1.5s ease-in-out infinite alternate;"></div>
</div>
<style>
@keyframes splashBar{from{width:36px}to{width:80px}}
</style>

<button class="fab" id="addBtn">+ הוסף נקודת עניין</button>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <h2 id="modalTitle">נקודת עניין חדשה</h2>
    <input type="hidden" id="editId">
    <div class="field"><label>יום (מספר 1-13 או תיאור חופשי)</label><input id="f_day" placeholder="יום 14 / יום נוסף"></div>
    <div class="field"><label>תאריך</label><input id="f_date" placeholder="26/11/2026"></div>
    <div class="field"><label>שעה</label><input id="f_time" placeholder="10:00-12:00"></div>
    <div class="field"><label>שם המקום</label><input id="f_place" placeholder="שם המקום"></div>
    <div class="field"><label>כתובת (לניווט אוטומטי בגוגל מאפ)</label><input id="f_address" placeholder="כתובת באנגלית, למשל: Shibuya Tokyo Japan"></div>
    <div class="field"><label>קישור מפה מותאם (אופציונלי - גובר על הכתובת)</label><input id="f_maplink" placeholder="https://maps.google.com/..."></div>
    <div class="field">
      <label>קישורים לאתרים (אפשר כמה)</label>
      <div style="font-size:12px;color:var(--muted);margin-bottom:6px;">מדביקים את הכתובת בשדה עם https. אפשר להוסיף שם כמו "ויקיפדיה".</div>
      <div id="linksEditor"></div>
      <button type="button" id="addLinkBtn" class="btn-secondary" style="margin-top:6px;">+ הוסף קישור</button>
    </div>
    <div class="field">
      <label>תמונה</label>
      <input id="f_photo" placeholder="הדבק קישור (URL או Google Drive)..." oninput="previewImg()">
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
        <label id="uploadLabel" for="f_photo_file" style="cursor:pointer;font-size:13px;padding:6px 12px;border-radius:8px;background:var(--card2);border:1px solid var(--border);color:var(--text);">📷 בחר תמונה מהגלריה</label>
        <input type="file" id="f_photo_file" accept="image/*" style="display:none">
        <span id="uploadStatus" style="font-size:12px;color:var(--muted);"></span>
      </div>
      <img id="imgPreview" class="img-preview">
    </div>
    <div class="field"><label>טלפון</label><input id="f_phone" placeholder="+81-..."></div>
    <div class="field"><label>הערות קצרות</label><textarea id="f_notes" rows="2"></textarea></div>
    <div class="field"><label>תיאור מורחב (מה יש לראות/לעשות שם)</label><textarea id="f_desc" rows="4"></textarea></div>
    <div class="field"><label>עלות</label><input id="f_cost" placeholder="500 יין"></div>
    <div class="modal-actions">
      <button id="cancelBtn" class="link-edit">ביטול</button>
      <button id="saveBtn" class="btn-primary">שמירה</button>
    </div>
  </div>
</div>

<div class="modal-backdrop guide-modal" id="guideBackdrop">
  <div class="modal">
    <h2>📖 המדריך הלוגיסטי המורחב</h2>
    <select id="guideCategoryFilter" class="guide-cat-filter"><option value="all">כל הקטגוריות</option></select>
    <div id="guideList"></div>
    <div class="modal-actions">
      <button id="guideAddBtn" class="btn-secondary">+ הוסף סעיף</button>
      <button id="guideCloseBtn" class="link-edit">סגירה</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="sectionBackdrop">
  <div class="modal">
    <h2 id="sectionModalTitle">סעיף במדריך</h2>
    <input type="hidden" id="s_id">
    <div class="field"><label>כותרת הסעיף</label><input id="s_title" placeholder="לדוגמה: כרטיסי IC"></div>
    <div class="field"><label>קטגוריה</label><input id="s_category" list="categoryOptions" placeholder="למשל: תחבורה, אוכל, קניות"><datalist id="categoryOptions"></datalist></div>
    <div class="field">
      <label>תמונה</label>
      <input id="s_photo" placeholder="הדבק קישור (URL או Google Drive)..." oninput="previewSectionImg()">
      <div style="display:flex;align-items:center;gap:8px;margin-top:6px;">
        <label id="sectionUploadLabel" for="s_photo_file" style="cursor:pointer;font-size:13px;padding:6px 12px;border-radius:8px;background:var(--card2);border:1px solid var(--border);color:var(--text);">📷 בחר תמונה או PDF</label>
        <input type="file" id="s_photo_file" accept="image/*,application/pdf" style="display:none">
        <button type="button" id="s_photo_clear" style="cursor:pointer;font-size:13px;padding:6px 12px;border-radius:8px;background:transparent;border:1px solid var(--border);color:var(--danger,#c0392b);">🗑 הסר תמונה</button>
        <span id="sectionUploadStatus" style="font-size:12px;color:var(--muted);"></span>
      </div>
      <img id="sectionImgPreview" class="img-preview">
    </div>
    <div class="field"><label>תוכן הסעיף</label><textarea id="s_content" rows="10"></textarea></div>
    <div class="modal-actions">
      <button id="sectionCancelBtn" class="link-edit">ביטול</button>
      <button id="sectionSaveBtn" class="btn-primary">שמירה</button>
    </div>
  </div>
</div>

<div id="imgLightbox" class="lightbox" role="dialog" aria-modal="true">
  <div class="lightbox-bar">
    <button id="lightboxOut" class="lightbox-btn" aria-label="הקטן">−</button>
    <button id="lightboxIn" class="lightbox-btn" aria-label="הגדל">+</button>
    <button id="lightboxClose" class="lightbox-btn" aria-label="סגור">✕</button>
  </div>
  <img id="lightboxImg" alt="תצוגה מוגדלת">
</div>

<div id="allergyModal" class="allergy-modal" role="dialog" aria-modal="true" aria-label="כרטיס העדפות מזון">
  <div class="allergy-topbar">
    <button class="reset" id="allergyResetBtn">נקה סימונים</button>
    <strong>כרטיס העדפות מזון</strong>
    <button class="close" id="allergyCloseBtn">סגור ✕</button>
  </div>
  <div class="allergy-card" dir="rtl" id="allergyCardBody"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

function driveUrlToImg(url){
  if(!url) return url;
  const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
  if(m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=w2000`;
  const m2 = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
  if(m2) return `https://drive.google.com/thumbnail?id=${m2[1]}&sz=w2000`;
  return url;
}

function resizeImageToBase64(file, maxPx=400, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxPx / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let pdfjsPromise = null;
function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if(pdfjsPromise) return pdfjsPromise;
  pdfjsPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    script.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve(window.pdfjsLib);
    };
    script.onerror = ()=>reject(new Error('טעינת מנוע PDF נכשלה'));
    document.head.appendChild(script);
  });
  return pdfjsPromise;
}

function compressCanvasToJpeg(canvas, limit=980000){
  let quality = 0.92;
  let data = canvas.toDataURL('image/jpeg', quality);
  while(data.length > limit && quality > 0.4){
    quality -= 0.1;
    data = canvas.toDataURL('image/jpeg', quality);
  }
  let scale = 0.85;
  while(data.length > limit && scale > 0.3){
    const tmp = document.createElement('canvas');
    tmp.width = Math.max(1, Math.round(canvas.width * scale));
    tmp.height = Math.max(1, Math.round(canvas.height * scale));
    tmp.getContext('2d').drawImage(canvas, 0, 0, tmp.width, tmp.height);
    data = tmp.toDataURL('image/jpeg', 0.6);
    scale -= 0.15;
  }
  return data;
}

async function pdfToImageBase64(file, maxWidth=2200){
  const pdfjsLib = await loadPdfJs();
  const data = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data}).promise;
  const canvases = [];
  let totalHeight = 0;
  let targetWidth = 0;
  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const baseViewport = page.getViewport({scale:1});
    const scale = Math.min(4, maxWidth / baseViewport.width);
    const viewport = page.getViewport({scale});
    const canvas = document.createElement('canvas');
    canvas.width = Math.round(viewport.width);
    canvas.height = Math.round(viewport.height);
    await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
    canvases.push(canvas);
    totalHeight += canvas.height;
    targetWidth = Math.max(targetWidth, canvas.width);
  }
  const MAX_DIM = 4000;
  const fit = Math.min(1, MAX_DIM / targetWidth, MAX_DIM / totalHeight);
  const out = document.createElement('canvas');
  out.width = Math.round(targetWidth * fit);
  out.height = Math.round(totalHeight * fit);
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, out.width, out.height);
  let y = 0;
  for(const c of canvases){
    const w = Math.round(c.width * fit);
    const h = Math.round(c.height * fit);
    ctx.drawImage(c, 0, y, w, h);
    y += h;
  }
  return compressCanvasToJpeg(out);
}

function setupLightbox(){
  const box = document.getElementById('imgLightbox');
  const img = document.getElementById('lightboxImg');
  let scale = 1, tx = 0, ty = 0;
  const clamp = (v, lo, hi)=>Math.min(hi, Math.max(lo, v));
  function apply(){ img.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }
  function reset(){ scale = 1; tx = 0; ty = 0; apply(); }
  window.openLightbox = function(src){ if(!src) return; img.src = src; box.classList.add('open'); reset(); };
  function close(){ box.classList.remove('open'); img.removeAttribute('src'); }
  document.getElementById('lightboxClose').onclick = close;
  document.getElementById('lightboxIn').onclick = ()=>{ scale = clamp(scale * 1.4, 1, 8); apply(); };
  document.getElementById('lightboxOut').onclick = ()=>{ scale = clamp(scale / 1.4, 1, 8); if(scale === 1){ tx = 0; ty = 0; } apply(); };
  box.addEventListener('click', (e)=>{ if(e.target === box) close(); });

  let lastX = 0, lastY = 0, dragging = false;
  img.addEventListener('pointerdown', (e)=>{ if(e.pointerType === 'mouse'){ dragging = true; lastX = e.clientX; lastY = e.clientY; } });
  img.addEventListener('pointermove', (e)=>{ if(dragging && e.pointerType === 'mouse'){ tx += e.clientX - lastX; ty += e.clientY - lastY; lastX = e.clientX; lastY = e.clientY; apply(); } });
  window.addEventListener('pointerup', ()=>{ dragging = false; });
  img.addEventListener('wheel', (e)=>{ e.preventDefault(); scale = clamp(scale * (e.deltaY < 0 ? 1.15 : 0.87), 1, 8); if(scale === 1){ tx = 0; ty = 0; } apply(); }, {passive:false});
  img.addEventListener('dblclick', ()=>{ scale = scale > 1 ? 1 : 2.5; tx = 0; ty = 0; apply(); });

  let pinch = false, startDist = 0, startScale = 1;
  const dist = (t)=>Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  img.addEventListener('touchstart', (e)=>{
    if(e.touches.length === 2){ pinch = true; startDist = dist(e.touches); startScale = scale; }
    else if(e.touches.length === 1){ lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
  }, {passive:false});
  img.addEventListener('touchmove', (e)=>{
    if(pinch && e.touches.length === 2){ e.preventDefault(); scale = clamp(startScale * dist(e.touches) / startDist, 1, 8); apply(); }
    else if(!pinch && e.touches.length === 1 && scale > 1){ e.preventDefault(); tx += e.touches[0].clientX - lastX; ty += e.touches[0].clientY - lastY; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; apply(); }
  }, {passive:false});
  img.addEventListener('touchend', (e)=>{ if(e.touches.length < 2){ pinch = false; } if(scale === 1){ tx = 0; ty = 0; apply(); } });
}
setupLightbox();

const ALLERGY_STORAGE_KEY = "allergyChecks-v1";

function loadAllergyChecks(){
  try{ return new Set(JSON.parse(localStorage.getItem(ALLERGY_STORAGE_KEY) || "[]")); }
  catch(e){ return new Set(); }
}
function saveAllergyChecks(set){
  localStorage.setItem(ALLERGY_STORAGE_KEY, JSON.stringify([...set]));
}

function setupAllergyCard(){
  const body = document.getElementById("allergyCardBody");
  const modal = document.getElementById("allergyModal");
  const checks = loadAllergyChecks();

  function render(){
    let html = `
      <div class="header">
        <h1 class="title-jp" dir="ltr">お食事制限</h1>
        <h2 class="title-he">כרטיס הגבלות והעדפות מזון למסעדה</h2>
      </div>
      <div class="message-jp" dir="ltr">
        誠にお手数ではございますが、以下のチェックされた食材を避けていただけますでしょうか。<br>
        <span class="message-he">(אנא הימנעו מהמרכיבים המסומנים מטה ב-✔)</span>
      </div>`;
    ALLERGY_GROUPS.forEach((group, gi)=>{
      html += `<div class="section-title">${group.title}</div><table class="allergy-table">`;
      group.items.forEach((item, ii)=>{
        const id = `g${gi}-i${ii}`;
        const on = checks.has(id);
        html += `<tr class="allergy-row ${on ? "checked" : ""}" data-id="${id}">
          <td class="checkbox">${on ? "✔" : "☐"}</td>
          <td>${item.he}</td>
          <td class="jp-text" dir="ltr">${item.jp}</td>
        </tr>`;
      });
      html += `</table>`;
    });
    body.innerHTML = html;
    body.querySelectorAll(".allergy-row").forEach((row)=>{
      row.onclick = ()=>{
        const id = row.getAttribute("data-id");
        if(checks.has(id)) checks.delete(id); else checks.add(id);
        saveAllergyChecks(checks);
        render();
      };
    });
  }

  window.openAllergyCard = function(){ render(); modal.classList.add("open"); document.body.style.overflow = "hidden"; };
  function close(){ modal.classList.remove("open"); document.body.style.overflow = ""; }
  document.getElementById("allergyCloseBtn").onclick = close;
  document.getElementById("allergyResetBtn").onclick = ()=>{
    if(confirm("לנקות את כל הסימונים?")){ checks.clear(); saveAllergyChecks(checks); render(); }
  };
}
setupAllergyCard();

function normalizeLinkUrl(raw){
  let url = String(raw || "")
    .replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, "")
    .trim();
  if(!url) return "";
  if(/^www\./i.test(url)) url = "https://" + url;
  if(!/^[a-z][a-z0-9+.-]*:/i.test(url)) url = "https://" + url;
  return url;
}

function looksLikeUrl(value){
  const text = String(value || "").trim();
  return /^(https?:\/\/|www\.|[a-z0-9-]+\.[a-z]{2,})/i.test(text);
}

function getPointLinks(item){
  const links = [];
  const seen = new Set();
  const push = (title, rawUrl)=>{
    const url = normalizeLinkUrl(rawUrl);
    if(!url || seen.has(url)) return;
    seen.add(url);
    links.push({title: String(title || "").trim() || "קישור", url});
  };
  if(Array.isArray(item?.links)){
    item.links.forEach((link)=>push(link?.title, link?.url));
  }
  push("אתר", item?.websiteUrl);
  return links;
}

function addLinkRow(title="", url=""){
  const editor = document.getElementById("linksEditor");
  const row = document.createElement("div");
  row.className = "link-row";
  const urlInput = document.createElement("input");
  urlInput.className = "link-url";
  urlInput.type = "url";
  urlInput.inputMode = "url";
  urlInput.placeholder = "הדביקו כאן את הכתובת https://...";
  urlInput.value = url;
  urlInput.dir = "ltr";
  const titleInput = document.createElement("input");
  titleInput.className = "link-title";
  titleInput.placeholder = "שם הקישור (אופציונלי)";
  titleInput.value = title;
  const removeBtn = document.createElement("button");
  removeBtn.type = "button";
  removeBtn.className = "link-remove";
  removeBtn.textContent = "✕";
  removeBtn.onclick = ()=>{
    row.remove();
    if(!editor.querySelector(".link-row")) addLinkRow();
  };
  row.appendChild(urlInput);
  row.appendChild(titleInput);
  row.appendChild(removeBtn);
  editor.appendChild(row);
  return urlInput;
}

function fillLinksEditor(links){
  const editor = document.getElementById("linksEditor");
  editor.innerHTML = "";
  if(links.length) links.forEach((link)=>addLinkRow(link.title, link.url));
  else addLinkRow();
}

function readLinksFromEditor(){
  const rows = [...document.querySelectorAll("#linksEditor .link-row")];
  const links = [];
  const seen = new Set();
  rows.forEach((row)=>{
    let title = row.querySelector(".link-title")?.value.trim() || "";
    let url = row.querySelector(".link-url")?.value.trim() || "";
    if(!url && looksLikeUrl(title)){
      url = title;
      title = "קישור";
    } else if(url && !looksLikeUrl(url) && looksLikeUrl(title)){
      const swapped = url;
      url = title;
      title = swapped;
    }
    url = normalizeLinkUrl(url);
    if(!url || seen.has(url)) return;
    seen.add(url);
    links.push({title: title || "קישור", url});
  });
  return links;
}

{order:7, title:"טיפים למטיילים עצמאיים בכושר טוב", content:"שירות משלוח מזוודות (Takkyubin/Takuhaibin): הסוד השמור של המטיילים המנוסים. חברת Yamato Transport (לוגו חתולה שחורה) מעבירה מזוודות בין מלונות תמורת כ-2,000-3,000 ין למזוודה, מגיעות למחרת. אפשר לנסוע בשינקנסן רק עם תיק גב.\n\nנעליים: ילכו 15,000-25,000 צעדים ביום כולל שיפועים ומדרגות אבן. הביאו נעלי הליכה איכותיות עם סוליה מונעת החלקה - מדרגות מקדשים ושורשי עצים חלקלקים בנובמבר."},
{order:8, title:"סניפי יוניקלו (Uniqlo) חובה", content:"Uniqlo Ginza (טוקיו): חנות הדגל הגדולה בעולם, 12 קומות. קומה שלמה של עיצובים בהתאמה אישית (UTme!), בית קפה, כל קולקציה אפשרית. כתובת: 6 Chome-9-5 Ginza, Chuo City, Tokyo.\n\nUniqlo Shinsaibashi (אוסקה): סניף דגל ענק עם חזית אדריכלית מוארת, נוח לקניות מרוכזות במהלך יום הסיור באוסקה. כתובת: 1 Chome-9-1 Shinsaibashisuji, Chuo Ward, Osaka.\n\nטיפ מס (Tax-Free): הגיעו עם הדרכון הפיזי (לא צילום). בקנייה מעל 5,000 ין ברשתות הגדולות מתקבל פטור מיידי ממס בגובה 10% בקופה."},
{order:9, title:"חנויות סכינים איכותיות (סכיני שף בעבודת יד)", content:"סכין שף יפנית (Gyuto, Santoku או Nakiri) עשויה פלדת פחמן גבוהה (שרוגאמי/אאוגאמי) ושומרת על חדות יוצאת דופן.\n\nבאוסקה (רחוב Doguyasuji): Sakai Ichimonji Mitsuhide - אחת החנויות המוערכות ביפן, ממקור סאקאי (עיר נפחי הסכינים ההיסטורית), עם הטבעת שם ביפנית על הלהב במקום. כתובת: 14-8 Nambasennichimae, Chuo Ward, Osaka.\n\nבטוקיו (רחוב Kappabashi): Kama-Asa - עיצוב מודרני, צוות דובר אנגלית מצוינת שמסביר על סוגי הפלדות ומאפשר ניסוי חיתוך במקום. כתובת: 2 Chome-24-1 Matsugaya, Taito City, Tokyo.\nTsubaya - חנות מסורתית עמוסה בלב קאפבאשי עם ריכוז סכינים מכל אזורי הנפחות ביפן (Sakai, Takefu, Seki). כתובת: 3 Chome-7-2 Nishiasakusa, Taito City, Tokyo."},

let guideData = [];

async function ensureGuideSeeded(){
  const snap = await getDocs(guideRef);
  if(snap.empty){
    const batch = writeBatch(db);
    DEFAULT_GUIDE.forEach(item=>{
      const ref = doc(guideRef);
      batch.set(ref, item);
    });
    await batch.commit();
  }
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function linkify(text){
  const escaped = escapeHtml(text||'');
  return escaped.replace(/(https?:\/\/[^\s<]+)/g, url=>{
    const clean = url.replace(/[).,]+$/,'');
    const trail = url.slice(clean.length);
    return `<a href="${clean}" target="_blank" rel="noopener" style="color:var(--accent2);text-decoration:underline;">${clean}</a>${trail}`;
  });
}
const DEFAULT_CATEGORY = "כללי";
const DEFAULT_GUIDE_CATEGORIES = ["כללי", "תחבורה", "כסף ותשלומים", "אוכל", "קניות", "אפליקציות שימושיות", "טיפים"];

function guideCategory(sec){
  return (sec.category && sec.category.trim()) || DEFAULT_CATEGORY;
}
function categoriesInUse(){
  const seen = [];
  guideData.forEach(sec=>{
    const cat = guideCategory(sec);
    if(!seen.includes(cat)) seen.push(cat);
  });
  return seen.sort((a,b)=>a.localeCompare(b,'he'));
}
function categorySuggestions(){
  const set = new Set(DEFAULT_GUIDE_CATEGORIES);
  categoriesInUse().forEach(cat=>set.add(cat));
  return [...set];
}
function renderCategoryOptions(){
  const datalist = document.getElementById('categoryOptions');
  datalist.innerHTML = '';
  categorySuggestions().forEach(cat=>{
    const opt = document.createElement('option');
    opt.value = cat;
    datalist.appendChild(opt);
  });
}
function renderGuideCategoryFilter(){
  const sel = document.getElementById('guideCategoryFilter');
  const current = sel.value;
  sel.innerHTML = '<option value="all">כל הקטגוריות</option>';
  categoriesInUse().forEach(cat=>{
    const opt = document.createElement('option');
    opt.value = cat; opt.textContent = cat;
    sel.appendChild(opt);
  });
  if([...sel.options].some(o=>o.value===current)) sel.value = current;
}

function renderGuideSection(sec){
  const div = document.createElement('div');
  div.className = 'guide-section';
  if(sec.photoUrl){
    const img = document.createElement('img');
    img.className='card-photo'; img.src=sec.photoUrl; img.loading='lazy';
    img.onerror = ()=>{ img.style.display='none'; };
    img.onclick = ()=>openLightbox(sec.photoUrl);
    div.appendChild(img);
  }
  const h3 = document.createElement('h3'); h3.textContent = sec.title;
  const p = document.createElement('p'); p.innerHTML = linkify(sec.content);
  div.appendChild(h3); div.appendChild(p);
  const actions = document.createElement('div'); actions.className='actions';
  const editBtn = document.createElement('button');
  editBtn.className='link-edit'; editBtn.textContent='✏ עריכה';
  editBtn.onclick = ()=>openSectionModal(sec);
  actions.appendChild(editBtn);
  const delBtn = document.createElement('button');
  delBtn.className='link-del'; delBtn.textContent='🗑 מחיקה';
  delBtn.onclick = ()=>{
    if(confirm('למחוק את הסעיף "'+sec.title+'"?')) deleteDoc(doc(db,'guide',sec.id));
  };
  actions.appendChild(delBtn);
  div.appendChild(actions);
  return div;
}

function renderGuide(){
  const list = document.getElementById('guideList');
  list.innerHTML = '';
  renderGuideCategoryFilter();
  renderCategoryOptions();

  const filterCat = document.getElementById('guideCategoryFilter').value;
  const grouped = {};
  const order = [];
  [...guideData]
    .sort((a,b)=>(a.order||999)-(b.order||999))
    .forEach(sec=>{
      const cat = guideCategory(sec);
      if(filterCat!=='all' && cat!==filterCat) return;
      if(!grouped[cat]){ grouped[cat]=[]; order.push(cat); }
      grouped[cat].push(sec);
    });

  if(order.length===0){
    list.innerHTML = '<div class="empty-msg">אין סעיפים להצגה</div>';
    return;
  }

  order.sort((a,b)=>a.localeCompare(b,'he')).forEach(cat=>{
    const title = document.createElement('div');
    title.className = 'guide-cat-title';
    title.innerHTML = '<span>'+escapeHtml(cat)+'</span><span class="count">'+grouped[cat].length+' סעיפים</span>';
    list.appendChild(title);
    grouped[cat].forEach(sec=>list.appendChild(renderGuideSection(sec)));
  });
}

function openSectionModal(sec){
  document.getElementById('sectionModalTitle').textContent = sec ? 'עריכת סעיף' : 'סעיף חדש';
  document.getElementById('s_id').value = sec ? sec.id : '';
  renderCategoryOptions();
  const activeFilter = document.getElementById('guideCategoryFilter').value;
  document.getElementById('s_category').value = sec
    ? guideCategory(sec)
    : (activeFilter && activeFilter!=='all' ? activeFilter : '');
  document.getElementById('s_title').value = sec ? sec.title : '';
  document.getElementById('s_photo').value = sec ? (sec.photoUrl||'') : '';
  document.getElementById('s_content').value = sec ? sec.content : '';
  document.getElementById('sectionUploadStatus').textContent = '';
  previewSectionImg();
  document.getElementById('sectionBackdrop').classList.add('open');
}

let data = [];

async function ensureSeeded(){
  const metaRef = doc(db, '_meta', 'seeded');
  const metaSnap = await getDoc(metaRef);
  if(metaSnap.exists()) return;
  await setDoc(metaRef, {at: Date.now()});
  const batch = writeBatch(db);
  DEFAULT_DATA.forEach(item=>{
    const ref = doc(pointsRef);
    batch.set(ref, {...item, done:false, mapLink:"", photoUrl:"", desc:""});
  });
  await batch.commit();
}

function mapsUrl(item){
  if(item.mapLink && item.mapLink.trim()) return normalizeLinkUrl(item.mapLink);
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(item.address||'');
}
function telUrl(phone){
  return 'tel:' + phone.replace(/[^0-9+]/g,'');
}

function dayNum(day){
  const m = String(day||'').match(/\d+/);
  return m ? parseInt(m[0],10) : 9999;
}
function timeNum(time){
  const m = String(time||'').match(/(\d{1,2}):(\d{2})/);
  return m ? (parseInt(m[1],10)*60 + parseInt(m[2],10)) : 9999;
}
function uniqueDays(){
  const seen = [];
  data.forEach(d=>{ if(!seen.includes(d.day)) seen.push(d.day); });
  seen.sort((a,b)=> dayNum(a)-dayNum(b) || String(a).localeCompare(String(b)));
  return seen;
}

function renderDayFilter(){
  const sel = document.getElementById('dayFilter');
  const current = sel.value;
  sel.innerHTML = '<option value="all">כל הימים</option>';
  uniqueDays().forEach(day=>{
    const opt = document.createElement('option');
    opt.value = day; opt.textContent = day;
    sel.appendChild(opt);
  });
  if([...sel.options].some(o=>o.value===current)) sel.value = current;
}

function render(){
  renderDayFilter();
  const main = document.getElementById('main');
  main.innerHTML = '';
  const filterDay = document.getElementById('dayFilter').value;
  const q = document.getElementById('searchBox').value.trim().toLowerCase();

  let filtered = data.filter(d=>{
    if(filterDay!=='all' && d.day!==filterDay) return false;
    if(q && !(d.place||'').toLowerCase().includes(q) && !(d.notes||'').toLowerCase().includes(q) && !(d.desc||'').toLowerCase().includes(q)) return false;
    return true;
  });

  if(filtered.length===0){
    main.innerHTML = '<div class="empty-msg">לא נמצאו נקודות עניין</div>';
    updateStats();
    return;
  }

  const grouped = {};
  const order = [];
  filtered.forEach(d=>{
    if(!grouped[d.day]){ grouped[d.day]=[]; order.push(d.day); }
    grouped[d.day].push(d);
  });

  order.sort((a,b)=> dayNum(a)-dayNum(b) || String(a).localeCompare(String(b)));
  Object.keys(grouped).forEach(day=>{
    grouped[day].sort((a,b)=> timeNum(a.time)-timeNum(b.time));
  });

  order.forEach(day=>{
    const groupDiv = document.createElement('div');
    groupDiv.className='day-group';
    const title = document.createElement('div');
    title.className='day-title';
    title.textContent = day + (grouped[day][0].date ? '  •  ' + grouped[day][0].date : '');
    groupDiv.appendChild(title);

    grouped[day].forEach(item=>{
      groupDiv.appendChild(renderCard(item));
    });
    main.appendChild(groupDiv);
  });

  updateStats();
}

document.getElementById('importFile').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  if(!confirm('שחזור יוסיף את כל הנקודות מהגיבוי מעל הנתונים הקיימים. להמשיך?')) return;
  const text = await file.text();
  let backup;
  try { backup = JSON.parse(text); } catch{ alert('קובץ לא תקין'); return; }
  if(!backup.points){ alert('קובץ גיבוי לא מזוהה'); return; }
  const batch = writeBatch(db);
  backup.points.forEach(item=>{
    const {id, ...data} = item;
    batch.set(doc(pointsRef), data);
  });
  if(backup.guide){
    backup.guide.forEach(item=>{
      const {id, ...data} = item;
      batch.set(doc(guideRef), data);
    });
  }
  await batch.commit();
  e.target.value = '';
  alert(`✓ שוחזרו ${backup.points.length} נקודות עניין בהצלחה`);
});

document.getElementById('dedupBtn').onclick = async ()=>{
  const snap = await getDocs(pointsRef);
  const all = snap.docs.map(d=>({id:d.id, ...d.data()}));
  const seen = {};
  const toDelete = [];
  all.forEach(item=>{
    const key = (item.place||'').trim() + '|' + (item.day||'').trim() + '|' + (item.time||'').trim();
    if(seen[key]){
      const existing = seen[key];
      const existingScore = Object.values(existing).filter(v=>v && v!=='-').length;
      const newScore = Object.values(item).filter(v=>v && v!=='-').length;
      if(newScore > existingScore){
        toDelete.push(existing.id);
        seen[key] = item;
      } else {
        toDelete.push(item.id);
      }
    } else {
      seen[key] = item;
    }
  });
  if(toDelete.length === 0){
    alert('לא נמצאו כפילויות!');
    return;
  }
  if(confirm(`נמצאו ${toDelete.length} כפילויות. למחוק אותן?`)){
    const batch = writeBatch(db);
    toDelete.forEach(id => batch.delete(doc(db,'points',id)));
    await batch.commit();
    alert(`✓ נמחקו ${toDelete.length} כפילויות בהצלחה`);
  }
};

let leafletMap = null, mapMarkers = [];

function geocacheKey(addr){ return 'geo:'+addr; }

async function geocode(address){
  const key = geocacheKey(address);
  const cached = localStorage.getItem(key);
  if(cached) return JSON.parse(cached);
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(address)}&limit=1`,
      {headers:{'Accept-Language':'en','User-Agent':'japan-trip-app'}});
    const j = await r.json();
    if(j.length){
      const result = {lat:parseFloat(j[0].lat), lng:parseFloat(j[0].lon)};
      localStorage.setItem(key, JSON.stringify(result));
      return result;
    }
  }catch(e){}
  return null;
}

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {attribution:'© OpenStreetMap contributors', maxZoom:19}).addTo(leafletMap);
  }
  await renderMapMarkers(sel.value);
  sel.onchange = ()=> renderMapMarkers(sel.value);
}

async function renderMapMarkers(filterDay){
  mapMarkers.forEach(m=>m.remove());
  mapMarkers = [];
  const days = uniqueDays();
  const filtered = filterDay==='all' ? data : data.filter(d=>d.day===filterDay);
  const status = document.getElementById('mapStatus');
  const bounds = [];
  let done=0;

  for(const item of filtered){
    if(!item.address) continue;
    status.textContent = `ממפה נקודות... ${done+1}/${filtered.length}`;
    const coords = await geocode(item.address);
    done++;
    if(!coords) continue;
    const dayIdx = days.indexOf(item.day) % DAY_COLORS.length;
    const color = DAY_COLORS[dayIdx];
    const icon = L.divIcon({
      className:'',
      html:`<div style="width:14px;height:14px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,0.4)"></div>`,
      iconSize:[14,14], iconAnchor:[7,7]
    });
    const marker = L.marker([coords.lat, coords.lng], {icon})
      .bindPopup(`<b style="font-size:14px">${item.place}</b><br><span style="color:#666;font-size:12px">${item.day}${item.time?' · '+item.time:''}</span>${item.notes?'<br><span style="font-size:12px">'+item.notes+'</span>':''}`)
      .addTo(leafletMap);
    mapMarkers.push(marker);
    bounds.push([coords.lat, coords.lng]);
    if(bounds.length===1) leafletMap.setView([coords.lat,coords.lng],13);
    await new Promise(r=>setTimeout(r,1100));
  }
  if(bounds.length>1) leafletMap.fitBounds(bounds, {padding:[30,30]});
  status.textContent = `${bounds.length} נקודות על המפה`;
  setTimeout(()=>leafletMap.invalidateSize(),100);
}

let locationMarker = null, locationCircle = null, locationWatchId = null, locationCentered = false;

function locateMe(){
  if(!leafletMap) return;
  const status = document.getElementById('mapStatus');
  if(!navigator.geolocation){ status.textContent = 'הדפדפן לא תומך באיתור מיקום'; return; }
  status.textContent = 'מאתר את המיקום שלך...';
  locationCentered = false;
  if(locationWatchId !== null) navigator.geolocation.clearWatch(locationWatchId);
  locationWatchId = navigator.geolocation.watchPosition(pos=>{
    const {latitude, longitude, accuracy} = pos.coords;
    const latlng = [latitude, longitude];
    if(locationMarker){
      locationMarker.setLatLng(latlng);
    } else {
      const icon = L.divIcon({className:'', html:'<div class="my-location-dot"></div>', iconSize:[22,22], iconAnchor:[11,11]});
      locationMarker = L.marker(latlng, {icon, zIndexOffset:1000}).bindPopup('אתה כאן').addTo(leafletMap);
    }
    if(locationCircle){
      locationCircle.setLatLng(latlng).setRadius(accuracy);
    } else {
      locationCircle = L.circle(latlng, {radius:accuracy, color:'#2c7ab2', fillColor:'#2c7ab2', fillOpacity:0.12, weight:1}).addTo(leafletMap);
    }
    if(!locationCentered){ leafletMap.setView(latlng, 15); locationCentered = true; }
    status.textContent = `המיקום שלך מסומן (דיוק בערך ${Math.round(accuracy)} מטר)`;
  }, err=>{
    const messages = {1:'הגישה למיקום נדחתה. אפשר לאשר הרשאת מיקום בהגדרות הדפדפן.', 2:'לא ניתן לאתר את המיקום כרגע.', 3:'האיתור ארך יותר מדי, נסה שוב.'};
    status.textContent = messages[err.code] || 'שגיאה באיתור מיקום';
  }, {enableHighAccuracy:true, maximumAge:10000, timeout:15000});
}

    hideSplash();
    document.getElementById('stats').innerHTML = '<span class="sync-badge sync-bad">⚠ שגיאת חיבור</span> ' + err.message;
  });

  onSnapshot(guideRef, (snap)=>{
    guideData = snap.docs.map(d=>({id:d.id, ...d.data()}));
    renderGuide();
  });

  ensureSeeded();
  ensureGuideSeeded();
}

document.getElementById('guideBtn').onclick = ()=>document.getElementById('guideBackdrop').classList.add('open');
document.getElementById('guideCloseBtn').onclick = ()=>document.getElementById('guideBackdrop').classList.remove('open');
document.getElementById('guideBackdrop').onclick = (e)=>{ if(e.target.id==='guideBackdrop') document.getElementById('guideBackdrop').classList.remove('open'); };
document.getElementById('guideAddBtn').onclick = ()=>openSectionModal(null);
document.getElementById('sectionCancelBtn').onclick = ()=>document.getElementById('sectionBackdrop').classList.remove('open');
document.getElementById('sectionBackdrop').onclick = (e)=>{ if(e.target.id==='sectionBackdrop' && confirm('לסגור? השינויים לא יישמרו.')) document.getElementById('sectionBackdrop').classList.remove('open'); };

document.getElementById('sectionSaveBtn').onclick = async ()=>{
  const id = document.getElementById('s_id').value;
  const title = document.getElementById('s_title').value.trim();
  const category = document.getElementById('s_category').value.trim() || DEFAULT_CATEGORY;
  const photoUrl = document.getElementById('s_photo').value.trim();
  const content = document.getElementById('s_content').value.trim();
  if(!title){ alert('יש להזין כותרת'); return; }
  if(id){
    await updateDoc(doc(db,'guide',id), {title, category, photoUrl, content});
  } else {
    const maxOrder = guideData.reduce((m,s)=>Math.max(m, s.order||0), 0);
    await addDoc(guideRef, {title, category, photoUrl, content, order: maxOrder+1});
  }
  document.getElementById('sectionBackdrop').classList.remove('open');
};

document.getElementById('guideCategoryFilter').onchange = renderGuide;

let syncStarted = false;
onAuthStateChanged(auth, (user)=>{
  if(!user || syncStarted) return;
  syncStarted = true;
  startSync();
});

signInAnonymously(auth).catch((err)=>{
  hideSplash();
  document.getElementById('stats').innerHTML = '<span class="sync-badge sync-bad">⚠ שגיאת התחברות</span> ' + err.code;
});
</script>
</body>
</html>
